<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NammaCare - Senior Guardian System</title>
<!-- Modern Typography: Space Grotesk represents premium futuristic UI -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="styles.css?v=20260516a" rel="stylesheet"/>
</head>
<body>
<!-- Ambient glowing backgrounds spanning viewport -->
<div class="ambient-glow glow-blue"></div>
<div class="ambient-glow glow-pink"></div>
<div class="ambient-glow glow-green"></div>
<!-- Navigation Bar -->
<header class="navbar glass-dark" id="navbar">
<div class="nav-container">
<a class="brand" href="index.html">
<img alt="Logo" class="brand-logo" src="logo.png" style="object-fit:cover; padding: 2px; background: white;"/>
<span class="brand-text">Namma<span class="text-green">Care</span></span>
</a>
<nav class="nav-links" id="nav-links">
<!-- Dynamically injected links based on auth role -->
</nav>
<div class="nav-controls" id="nav-controls">
<!-- Auth button / User profile -->
</div>
</div>
</header>
<main>
<section class="main-container view active" id="help-request-view">
<div class="page-header slide-up">
<div>
<h1 class="page-title">Request Help</h1>
<p class="page-subtitle text-blue font-bold">Connect with verified volunteers nearby.</p>
</div>
</div>
<div class="alert-success hidden slide-up" id="help-success-alert">
<span class="text-3xl">✓</span>
<p class="font-bold text-lg">Successfully broadcasted to nearby NammaCare Volunteers in your area!</p>
</div>
<form class="glass-panel slide-up delay-1" onsubmit="app.submitHelpRequest(event)">
<div class="form-group">
<label class="text-blue">Assistance Category</label>
<select class="input-field select-field font-bold text-lg" id="req-category">
<option value="Grocery Delivery">Grocery Delivery (e.g. Spar, Reliance)</option>
<option value="Medicine Pickup">Medicine Pickup (Apollo, MedPlus)</option>
<option value="Official Document Help">Official Document / Tech Assistance</option>
<option value="Medical Escort">Medical Escort (To Manipal / Fortis)</option>
<option value="Social Visit">Social Visit / Companionship</option>
</select>
</div>
<div class="form-group">
<label class="text-blue">Description &amp; Custom Details</label>
<textarea class="input-field h-32" id="req-desc" placeholder="E.g., Please pickup my BP medication from Apollo..."></textarea>
</div>
<div class="form-row">
<div class="form-group">
<label class="text-blue">Preferred Date &amp; Time</label>
<input class="input-field" id="req-date" required="" type="datetime-local"/>
</div>
<div class="form-group">
<label class="text-blue">Urgency Level</label>
<div class="urgency-selector">
<button class="urgency-btn active" data-level="Normal" onclick="app.setUrgency(this, 'Normal')" type="button">Normal</button>
<button class="urgency-btn" data-level="Urgent" onclick="app.setUrgency(this, 'Urgent')" type="button">Urgent</button>
</div>
</div>
</div>
<button class="btn btn-primary w-full shadow-glow mt-4" type="submit">Generate Request</button>
</form>
<div class="mt-12 slide-up delay-2">
<h2 class="text-3xl font-bold text-white mb-6">Your Recent Requests</h2>
<div class="requests-list" id="citizen-requests-list">
<!-- Populated by JS -->
</div>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=20260516a"></script>
</body>
</html>
