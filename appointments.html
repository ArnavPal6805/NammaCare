<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NammaCare - Appointments</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="styles.css?v=20260520b" rel="stylesheet"/>
</head>
<body>
<div class="ambient-glow glow-pink" style="top: 10%; left: 10%;"></div>
<div class="ambient-glow glow-blue" style="bottom: -10%; right: 20%;"></div>
<!-- Navigation Bar -->
<header class="navbar glass-dark" id="navbar">
<div class="nav-container">
<a class="brand" href="index.html">
<img alt="Logo" class="brand-logo" src="logo.png" style="object-fit:cover; padding: 2px; background: white;"/>
<span class="brand-text">Namma<span class="text-green">Care</span></span>
</a>
<nav class="nav-links" id="nav-links"></nav>
<div class="nav-controls" id="nav-controls"></div>
</div>
</header>
<main>
<section class="main-container view active slide-up" id="appointments-view">
<div class="page-header">
<div>
<h1 class="page-title text-white">Doctor <span class="text-pink">Directory</span></h1>
<p class="page-subtitle">Schedule virtual or in-person consultations</p>
</div>
</div>
<div class="alert-error hidden" id="help-success-alert" style="border-color: var(--c-pink); background: rgba(255,0,122,0.1);">
<h3 class="text-pink mb-0">System Updated Successfully</h3>
</div>
<div>
<!-- Add Appointment Form -->
<div class="glass-panel">
<h2 class="text-white font-bold text-2xl mb-4">Book Slot</h2>
<form id="appt-form">
<div class="form-group">
<label>Specialization / Doctor</label>
<select class="input-field" id="appt-doctor" required="">
<option value="">Loading registered doctors...</option>
</select>
</div>
<div class="form-group" style="display: flex; gap: 1rem;">
<div style="flex:1;">
<label>Date</label>
<input class="input-field" id="appt-date" required="" type="date"/>
</div>
<div style="flex:1;">
<label>Time</label>
<input class="input-field" id="appt-time" required="" type="time"/>
</div>
</div>
<button class="btn btn-primary w-full" style="background: linear-gradient(45deg, var(--c-pink), #cc0061); box-shadow: 0 0 20px var(--pink-glow);" type="submit">Confirm Booking</button>
</form>
</div>
<!-- Upcoming Appointments List -->
<div>
<h2 class="text-white font-bold text-2xl mb-4">Current Appointments</h2>
<div id="appt-list">
<!-- Rendered by app.js -->
</div>
</div>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=20260520b"></script>
</body>
</html>
