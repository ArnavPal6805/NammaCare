<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NammaCare - Emergency Contacts</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="styles.css?v=20260520b" rel="stylesheet"/>
</head>
<body>
<div class="ambient-glow glow-yellow" style="top: 10%; right: 10%; background: var(--c-yellow);"></div>
<div class="ambient-glow glow-pink" style="bottom: -10%; left: -10%;"></div>
<!-- Navigation Bar -->
<header class="navbar glass-dark" id="navbar">
<div class="nav-container">
<a class="brand" href="index.html">
<img alt="Logo" class="brand-logo" src="logo.png" style="object-fit:cover; padding: 2px; background: white;"/>
<span class="brand-text">Namma<span class="text-green">Care</span></span>
</a>
<nav class="nav-links" id="nav-links"></nav>
<div class="nav-controls" id="nav-controls"></div>
</div>
</header>
<main>
<section class="main-container view active slide-up" id="contacts-view">
<div class="page-header">
<div>
<h1 class="page-title text-white">Emergency <span class="text-yellow">Contacts</span></h1>
<p class="page-subtitle">Manage automated alert routing</p>
</div>
</div>
<div class="alert-error hidden" id="help-success-alert" style="border-color: var(--c-yellow); background: rgba(255,176,32,0.1);">
<h3 class="text-yellow mb-0" id="contact-alert-msg">System Updated Successfully</h3>
</div>
<div>
<!-- Add Contact Form -->
<div class="glass-panel">
<h2 class="text-white font-bold text-2xl mb-4">New Contact Form</h2>
<form id="con-form">
<div class="form-group">
<label>Full Name</label>
<input class="input-field" id="con-name" placeholder="Contact Name" required="" type="text"/>
</div>
<div class="form-group">
<label>Relation</label>
<input class="input-field" id="con-rel" placeholder="e.g. Son, Daughter, Neighbor" required="" type="text"/>
</div>
<div class="form-group">
<label>Phone Number (10 digit)</label>
<input class="input-field" id="con-phone" pattern="[6-9][0-9]{9}" placeholder="e.g. 9876543210" required="" type="tel"/>
</div>
<div class="form-group flex-align mt-4 mb-6">
<input id="con-primary" style="accent-color: var(--c-yellow); width: 1.25rem; height: 1.25rem;" type="checkbox"/>
<label class="mb-0 text-white font-bold" for="con-primary" style="text-transform: none; font-size: 1rem;">Set as Primary Alert Contact</label>
</div>
<button class="btn btn-primary w-full" style="background: linear-gradient(45deg, var(--c-yellow), #e09b18); color: black; box-shadow: 0 0 20px rgba(255,176,32,0.3);" type="submit">Save Contact</button>
</form>
</div>
<!-- Contact Directory -->
<div>
<h2 class="text-white font-bold text-2xl mb-4">Contact Directory</h2>
<div id="contact-list">
<!-- Rendered by app.js -->
</div>
</div>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=20260520b"></script>
</body>
</html>
